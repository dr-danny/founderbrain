name: FounderBrain build and database proof
on:
  push:
    branches: [main, feat/founderbrain-railway-workers]
  pull_request:
    branches: [main, feat/founderbrain-railway-workers]
  workflow_dispatch:
concurrency:
  group: founderbrain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: founderbrain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TZ: UTC
      NODE_ENV: production
      ESBUILD_BINARY_PATH: ${{ github.workspace }}/node_modules/esbuild-wasm/bin/esbuild
      MIGRATION_DATABASE_URL: postgresql://postgres:ci-disposable-only@127.0.0.1:5432/founderbrain_test
      FB_TEST_MIGRATION_DATABASE_URL: postgresql://postgres:ci-disposable-only@127.0.0.1:5432/founderbrain_test
      FB_TEST_DATABASE_URL: postgresql://fb_runtime:ci-runtime-only@127.0.0.1:5432/founderbrain_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Create restricted disposable runtime roles
        run: |
          psql "$MIGRATION_DATABASE_URL" -c "CREATE ROLE fb_runtime LOGIN PASSWORD 'ci-runtime-only' NOSUPERUSER NOBYPASSRLS;"
          psql "$MIGRATION_DATABASE_URL" -c "CREATE ROLE fb_worker LOGIN PASSWORD 'ci-worker-only' NOSUPERUSER NOBYPASSRLS;"
      - name: Run actual native migrations and grants
        run: |
          RUNTIME_DB_ROLE=fb_runtime npm run fb:migrate
          RUNTIME_DB_ROLE=fb_worker npm run fb:migrate
      - run: npm run fb:build
      - run: npm run fb:test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser authentication regressions (local fixtures only)
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          python scripts/founderbrain-browser-test.py
      - name: Worker bundle only, no deployment
        run: npx wrangler deploy --dry-run --outdir dist/edge-dry-run
      - name: Production container build only, no push or deployment
        run: docker build -f deploy/railway/Dockerfile -t founderbrain:test .
      - name: Start production container against disposable native Postgres
        run: |
          KEY="$(openssl rand -base64 32)"
          GATE="$(openssl rand -hex 32)"
          docker run -d --name founderbrain-smoke --network host \
            -e DATABASE_URL="$FB_TEST_DATABASE_URL" -e GE_MASTER_KEY="$KEY" \
            -e ORIGIN_SECRET="$GATE" -e APP_ORIGIN=https://founderbrain.example.test \
            -e HEXCLAVE_PROJECT_ID=00000000-0000-4000-8000-000000000000 \
            -e HEXCLAVE_API_URL=https://api.hexclave.com \
            -e AI_ENABLED=false founderbrain:test
          trap 'docker rm -f founderbrain-smoke >/dev/null 2>&1' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/brain)" = 403
          curl -fsS -H "X-FounderBrain-Origin: $GATE" http://127.0.0.1:8080/api/config | grep '"authMode":"hexclave"'
          curl -fsS -H "X-FounderBrain-Origin: $GATE" http://127.0.0.1:8080/api/config | grep -v 'ssk_'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-FounderBrain-Origin: $GATE" http://127.0.0.1:8080/api/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-FounderBrain-Origin: $GATE" -H "x-stack-access-token: not-a-token" http://127.0.0.1:8080/api/me)" = 401
          docker exec founderbrain-smoke node --input-type=module -e "
            import {PgBrainStore} from './src/founderbrain/store.js';
            const s=new PgBrainStore(process.env.DATABASE_URL);
            const id=await s.ensureWorkspace('ci-container-fixture');
            const current=await s.read(id);
            current.brain.identity.name='Container restart fixture';
            await s.commit(id,current.brain,current.version,'ci-container-save');
            await s.close();"
          docker restart founderbrain-smoke
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health/ready
          docker exec founderbrain-smoke node --input-type=module -e "
            import {PgBrainStore} from './src/founderbrain/store.js';
            const s=new PgBrainStore(process.env.DATABASE_URL);
            const id=await s.ensureWorkspace('ci-container-fixture');
            const current=await s.read(id);
            if(current.version!==1||current.brain.identity.name!=='Container restart fixture')throw new Error('Restart persistence failed');
            await s.close();console.log('Encrypted revision survived container restart');"
